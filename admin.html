<title>Mosewa Admin — Dashboard</title>

<style>
:root{--text:#0b1230;--muted:#586075;--line:#e4e7f0;--bg:#f6f7fb;--navy:#0a1236;--navy2:#16205a;--gold:#c9972b;--gold-soft:#f6c55f;--gold-text:#8a6410;--on-gold:#2a1d00;--ok:#0f7b4a;--err:#b42318}
*{box-sizing:border-box}body{margin:0;font:14px/1.55 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--text);background:var(--bg)}
h1,h2,h3{font-family:Sora,sans-serif;margin:0;letter-spacing:-.015em}small{color:var(--muted)}[hidden]{display:none!important}
.ms{font-family:'Material Symbols Outlined';font-style:normal;font-size:20px;line-height:1;vertical-align:middle;display:inline-block}
button{font:inherit;cursor:pointer}input,select,textarea{font:inherit;color:var(--text)}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:10px;border:1px solid var(--line);background:#fff;padding:9px 16px;font-weight:700;font-size:13px}
.btn:hover{border-color:var(--gold)}.btn.gold{background:linear-gradient(90deg,#f0bf5a,#f6c55f);border-color:transparent;color:var(--on-gold)}.btn.navy{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.danger{color:var(--err)}.btn.sm{padding:6px 10px;font-size:12px}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,var(--navy),#05060d)}
.lcard{background:#fff;border-radius:22px;padding:36px;width:100%;max-width:400px;border-top:4px solid var(--gold-soft)}
.brand{font:800 24px Sora;color:var(--navy)}.brand i{color:var(--gold);font-style:normal}
label.f{display:block;font-weight:700;font-size:12.5px;margin:16px 0 6px}
.in{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;outline:none}.in:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(246,197,95,.3)}
.in.bad{border-color:var(--err)}.err{color:var(--err);font-size:12px;margin-top:5px}
.alert{border-radius:10px;padding:10px 14px;font-size:13px;margin-top:14px;background:#fdecea;color:var(--err);border:1px solid #f5c2bd}
/* app */
#app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{background:var(--navy);color:#cfd3ea;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;z-index:40;overflow:auto}
aside .brand{color:#fff;padding:0 10px 18px}aside small{color:#8f97c4;padding:12px 10px 4px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:800}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:#cfd3ea;font-weight:600;background:none;border:0;text-align:left;width:100%}
.nav:hover{background:rgba(255,255,255,.07)}.nav.on{background:rgba(246,197,95,.16);color:var(--gold-soft)}
.main{min-width:0}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:30}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
#view{padding:24px;max-width:1180px}.burger{display:none}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.stat{padding:18px}.stat b{font:700 28px Sora;display:block}.stat .ms{color:var(--gold)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:12px 14px;background:#fafbfd;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border:0}
.badge{font-size:11px;font-weight:700;border-radius:99px;padding:3px 10px;border:1px solid var(--gold);color:var(--gold-text)}.badge.g{border-color:#a7dcc3;color:var(--ok)}.badge.x{border-color:var(--line);color:var(--muted)}
.sw{width:38px;height:22px;border-radius:99px;border:0;background:#cdd2e3;position:relative;transition:.2s}.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--gold)}.sw.on::after{left:19px}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--navy)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.al li{margin:6px 0}
/* modal */
.modal{position:fixed;inset:0;background:rgba(5,6,13,.6);z-index:80;display:grid;place-items:center;padding:16px}.mbox{background:#fff;border-radius:20px;width:100%;max-width:620px;max-height:92vh;display:flex;flex-direction:column}
.mh,.mf{padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:10px}.mh{border-bottom:1px solid var(--line)}.mf{border-top:1px solid var(--line)}.mb{padding:6px 24px 20px;overflow:auto}
.chk{display:flex;align-items:center;gap:10px;margin-top:16px;font-weight:600}.pr{display:grid;grid-template-columns:60px 1fr auto;gap:10px;align-items:center;margin-bottom:8px}
.imgs{display:grid;gap:8px;margin-bottom:8px}.img{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:6px 10px}.img span{flex:1;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast{position:fixed;right:20px;bottom:20px;background:var(--navy);color:#fff;border-left:4px solid var(--gold-soft);border-radius:10px;padding:12px 18px;z-index:99;max-width:340px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
@media(max-width:860px){#app{display:block}aside{position:fixed;left:-260px;width:250px;transition:.25s}aside.open{left:0}.burger{display:inline-flex}#view{padding:16px}}
</style></head><body>

const sha=async x=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(x)))].map(b=>b.toString(16).padStart(2,'0')).join('');

 $('#who').innerHTML=`Masuk sebagai <b>${esc(me().name)}</b> · ${esc(me().role)}`}
let q='';

window.onhashchange=()=>authed()&&route();
function dash(){const L=db.listings,w=[];

 L.filter(l=>l.is_published&&!db.listing_images.some(i=>i.listing_id==l.id)).forEach(l=>w.push(`Unit <b>${esc(nm('device_models',l.device_model_id))}</b> dipublikasikan tanpa foto.`));
 db.cities.filter(c=>c.is_active&&!c.whatsapp).forEach(c=>w.push(`Cabang <b>${esc(c.name)}</b> aktif tetapi nomor WhatsApp kosong.`));
 const S=[['smartphone','Unit di katalog',L.length],['visibility','Unit tampil di website',L.filter(l=>l.is_published).length],['inventory','Unit tersedia',L.filter(l=>l.is_available).length],['location_on','Cabang aktif',db.cities.filter(c=>c.is_active).length],['article','Artikel tampil',db.articles.filter(a=>a.is_published).length],['reviews','Review tampil',db.testimonials.filter(t=>t.is_published).length]];
 $('#view').innerHTML=`<div class="head"><div><h2>Selamat datang 👋</h2><small>Kelola katalog, harga, foto, review, dan WhatsApp cabang. Perubahan tampil di website sesuai status publikasi.</small></div><button class="btn gold" onclick="location.hash='#/listings'"><span class="ms">add</span>Tambah unit</button></div>
 <div class="stats">${S.map(s=>`<div class="card stat"><span class="ms">${s[0]}</span><b>${s[2]}</b><small>${s[1]}</small></div>`).join('')}</div>
 <div class="card" style="padding:20px"><h3 style="font-size:16px">Perlu perhatian</h3>${w.length?`<ul class="al">${w.map(x=>`<li>⚠️ ${x}</li>`).join('')}</ul>`:'<p><small>Semua data sudah lengkap ✅</small></p>'}</div>`}
function table(k){const m=M[k],rows=db[k].filter(r=>!q||JSON.stringify(r).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)||(k==='articles'?b.id-a.id:a.id-b.id));
 $('#view').innerHTML=`<div class="head"><div class="row"><h2>${m.t}</h2>${m.extra?'<span class="badge x" title="Belum ada di ERD — tabel tambahan">tabel tambahan</span>':''}</div><div class="row"><input class="in" id="q" placeholder="Cari…" value="${esc(q)}" style="width:200px"/><button class="btn gold" id="add"><span class="ms">add</span>${m.add}</button></div></div>
 <div class="card tw"><table><thead><tr>${m.cols.map(c=>`<th>${c[0]}</th>`).join('')}<th></th></tr></thead><tbody>${rows.map(r=>`<tr>${m.cols.map(c=>`<td>${c[1](r)}</td>`).join('')}<td style="white-space:nowrap"><button class="btn sm" data-ed="${r.id}"><span class="ms" style="font-size:16px">edit</span>Ubah</button> <button class="btn sm danger" data-dl="${r.id}"><span class="ms" style="font-size:16px">delete</span></button></td></tr>`).join('')||`<tr><td colspan="9"><small>Belum ada data.</small></td></tr>`}</tbody></table></div>`;
 const qi=$('#q');qi.oninput=()=>{q=qi.value;const p=qi.selectionStart;table(k);const n=$('#q');n.focus();n.setSelectionRange(p,p)};
 $('#add').onclick=()=>form(k);$$('[data-ed]').forEach(b=>b.onclick=()=>form(k,+b.dataset.ed));$$('[data-dl]').forEach(b=>b.onclick=()=>del(k,+b.dataset.dl));
 $$('[data-tg]').forEach(b=>b.onclick=()=>{const[t,id,f]=b.dataset.tg.split('|'),r=db[t].find(x=>x.id==id);r[f]=!r[f];if(save()){table(k);toast(f==='is_published'?(r[f]?'Dipublikasikan — tampil di website.':'Dijadikan draf — disembunyikan dari website.'):'Perubahan disimpan.')}})}
function del(k,id){const r=db[k].find(x=>x.id==id),use=k==='cities'?db.listings.some(l=>l.city_id==id):k==='device_models'?db.listings.some(l=>l.device_model_id==id):k==='admins'?db.articles.some(a=>a.admin_id==id):0;
 if(use)return toast('Tidak bisa dihapus: masih dipakai data lain (unit katalog atau penulis artikel). Nonaktifkan saja.');
 if(k==='admins'){if(id==me().id)return toast('Tidak bisa menghapus akun yang sedang dipakai.');if(r.role==='superadmin'&&db.admins.filter(a=>a.role==='superadmin').length<2)return toast('Minimal harus ada satu superadmin.')}
 if(!confirm('Hapus data ini? Tindakan tidak dapat dibatalkan.'))return;db[k]=db[k].filter(x=>x.id!=id);if(k==='listings'){db.listing_prices=db.listing_prices.filter(p=>p.listing_id!=id);db.listing_images=db.listing_images.filter(p=>p.listing_id!=id)}if(save()){table(k);toast('Data dihapus.')}}
/* ===== Form tambah/ubah + validasi ===== */
const img2url=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,640/i.width),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.72))};i.onerror=no;i.src=r.result};r.onerror=no;r.readAsDataURL(f)});
function form(k,id){const m=M[k],row=id?db[k].find(r=>r.id==id):{},D={imgs:[],pr:{6:{},12:{},24:{}}};
 if(k==='listings'&&id){D.imgs=db.listing_images.filter(i=>i.listing_id==id).sort((a,b)=>a.sort_order-b.sort_order).map(i=>i.image_path);db.listing_prices.filter(p=>p.listing_id==id).forEach(p=>D.pr[p.duration_hours]={p:p.price_rupiah,a:p.is_active})}
 else if(k==='listings')[6,12,24].forEach(h=>D.pr[h]={p:'',a:true});
 const val=f=>row[f.k]!==undefined?row[f.k]:(typeof f.def==='function'?f.def():f.def)??(f.type==='bool'?0:'');
 const F=m.fields.map(f=>{const v=val(f),L=`<label class="f" for="f_${f.k}">${f.l}${f.req?' *':''}</label>`,E=`<div class="err" data-e="${f.k}" hidden></div>`;
  if(f.type==='bool')return`<label class="chk"><input type="checkbox" name="${f.k}" ${v?'checked':''}/>${f.l}</label>`;
  if(f.type==='textarea')return L+`<textarea class="in" rows="${f.rows||3}" name="${f.k}" id="f_${f.k}">${esc(v)}</textarea>`+E;
  if(f.type==='select')return L+`<select class="in" name="${f.k}" id="f_${f.k}"><option value="">${f.blank||'— pilih —'}</option>${f.opts().map(o=>`<option value="${o[0]}" ${o[0]==v?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`+E;
  if(f.type==='prices')return L+[6,12,24].map(h=>`<div class="pr"><b>${h} jam</b><input class="in" type="number" min="0" step="1000" placeholder="Harga (Rp)" data-p="${h}" value="${D.pr[h].p??''}"/><label class="row"><input type="checkbox" data-a="${h}" ${D.pr[h].a?'checked':''}/>Aktif</label></div>`).join('')+E;
  if(f.type==='images')return L+`<div class="imgs" id="imgs"></div><div class="row"><input type="file" id="imgf" accept="image/jpeg,image/png,image/webp" multiple/></div><div class="row" style="margin-top:8px"><input class="in" id="imgu" placeholder="atau tempel URL / path gambar" style="flex:1"/><button type="button" class="btn sm" id="imga">Tambah</button></div><small>JPG/PNG/WEBP, maks 3 MB per file. Urutan teratas = foto utama.</small>`+E;
  return L+`<input class="in" name="${f.k}" id="f_${f.k}" type="${f.type}" value="${esc(v)}"/>`+(f.hint?`<small>${f.hint}</small>`:'')+E}).join('');
 $('#mform').innerHTML=`<div class="mh"><h3>${id?'Ubah':'Tambah'} — ${m.t}</h3><button type="button" class="btn sm" id="mx">✕</button></div><div class="mb"><div class="alert" id="sum" hidden>Data belum valid. Perbaiki isian bertanda merah lalu simpan lagi.</div>${F}</div><div class="mf"><small>Sistem memvalidasi data &amp; berkas sebelum disimpan.</small><div class="row"><button type="button" class="btn" id="mc">Batal</button><button class="btn gold">Simpan perubahan</button></div></div>`;
 $('#modal').hidden=false;const close=()=>$('#modal').hidden=true;$('#mx').onclick=$('#mc').onclick=close;
 const ri=()=>{const b=$('#imgs');if(!b)return;b.innerHTML=D.imgs.map((s,i)=>`<div class="img"><img class="thumb" src="${esc(s)}" alt=""/><span>${i?'':'<b>Utama</b> · '}${esc(s.startsWith('data:')?'(file unggahan)':s)}</span><button type="button" class="btn sm" data-u="${i}">↑</button><button type="button" class="btn sm danger" data-x="${i}">✕</button></div>`).join('');$$('[data-u]',b).forEach(x=>x.onclick=()=>{const i=+x.dataset.u;if(i)[D.imgs[i-1],D.imgs[i]]=[D.imgs[i],D.imgs[i-1]];ri()});$$('[data-x]',b).forEach(x=>x.onclick=()=>{D.imgs.splice(+x.dataset.x,1);ri()})};ri();
 if($('#imgf'))$('#imgf').onchange=async e=>{const er=$('[data-e=images]');er.hidden=true;for(const f of e.target.files){if(!/^image\/(jpeg|png|webp)$/.test(f.type)||f.size>3*1048576){er.textContent=`“${f.name}” ditolak: hanya JPG/PNG/WEBP dan maks 3 MB.`;er.hidden=false;continue}try{D.imgs.push(await img2url(f))}catch(x){er.textContent=`“${f.name}” bukan gambar yang valid.`;er.hidden=false}}e.target.value='';ri()};
 if($('#imga'))$('#imga').onclick=()=>{const u=$('#imgu').value.trim();if(u){D.imgs.push(u);$('#imgu').value='';ri()}};
 $('#mform').onsubmit=async e=>{e.preventDefault();const V={},Er={};
  m.fields.forEach(f=>{if(f.type==='prices'||f.type==='images')return;const el=$(`[name=${f.k}]`);let v=f.type==='bool'?el.checked:el.value.trim();if(f.type==='number')v=v===''?0:Number(v);if(f.type==='select')v=v===''?null:(f.str?v:Number(v));V[f.k]=v;
   if(f.req&&(v===''||v===null))Er[f.k]='Wajib diisi.';else if(f.min&&String(v).length<f.min)Er[f.k]=`Minimal ${f.min} karakter.`});
  const sl=m.fields.find(f=>f.slug);if(sl){V.slug=V.slug||slug(V.name||V.title||'');if(!/^[a-z0-9-]+$/.test(V.slug))Er.slug='Slug hanya huruf kecil, angka, dan tanda minus.';else if(db[k].some(r=>r.slug===V.slug&&r.id!=id))Er.slug='Slug sudah dipakai.'}
  if(k==='contents'&&V.key&&db[k].some(r=>r.key===V.key&&r.id!=id))Er.key='Kunci sudah dipakai.';
  if(k==='listings'){const pr=[6,12,24].map(h=>{const p=$(`[data-p="${h}"]`).value,a=$(`[data-a="${h}"]`).checked;return{h,p:p===''?null:Number(p),a}});
   if(pr.some(x=>x.p!==null&&(!Number.isInteger(x.p)||x.p<=0)))Er.prices='Harga harus bilangan bulat lebih dari 0.';else if(pr.some(x=>x.a&&x.p===null))Er.prices='Harga yang diaktifkan wajib diisi.';else if(V.is_published&&!pr.some(x=>x.a))Er.prices='Unit yang dipublikasikan butuh minimal 1 harga aktif.';
   if(V.is_published&&!D.imgs.length)Er.images='Unit yang dipublikasikan butuh minimal 1 foto.';
   if(V.city_id&&V.device_model_id&&db.listings.some(l=>l.city_id==V.city_id&&l.device_model_id==V.device_model_id&&l.id!=id))Er.device_model_id='Unit model ini sudah ada di cabang tersebut.';V._pr=pr}
  if(m.v)m.v(V,Er,id);
  $$('.in.bad').forEach(x=>x.classList.remove('bad'));$$('[data-e]').forEach(x=>x.hidden=true);
  if(Object.keys(Er).length){Object.entries(Er).forEach(([f,t])=>{const e=$(`[data-e=${f}]`);if(e){e.textContent=t;e.hidden=false}const i=$(`[name=${f}]`);if(i)i.classList.add('bad')});$('#sum').hidden=false;$('.mb').scrollTop=0;return}
  if(k==='articles'){const n=new Date().toISOString();V.updated_at=n;if(!id)V.created_at=n}
  if(k==='admins'){if(V.password)V.password_hash=await sha(V.password);delete V.password}
  const pr=V._pr;delete V._pr;let r=row;if(id)Object.assign(r,V);else{r={id:uid(),...V};db[k].push(r)}
  if(k==='listings'){db.listing_prices=db.listing_prices.filter(p=>p.listing_id!=r.id);pr.filter(x=>x.p!==null).forEach(x=>db.listing_prices.push({id:uid(),listing_id:r.id,duration_hours:x.h,price_rupiah:x.p,is_active:x.a}));db.listing_images=db.listing_images.filter(p=>p.listing_id!=r.id);D.imgs.forEach((s,i)=>db.listing_images.push({id:uid(),listing_id:r.id,image_path:s,sort_order:i+1}))}
  if(save()){close();route();toast('Tersimpan. Perubahan tampil di website sesuai status publikasi.')}}}
gate();
